services:
  - type: web
    name: news-intelligence-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NEWS_API_KEY
        sync: false
      - key: ENABLE_TRANSFORMERS
        value: "false"
